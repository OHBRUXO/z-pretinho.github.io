<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:24px;font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:#050505;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:-25%;z-index:-2;
  background:
    radial-gradient(circle at 50% 12%,rgba(255,95,0,.28),transparent 27%),
    radial-gradient(circle at 12% 85%,rgba(255,110,0,.14),transparent 24%),
    radial-gradient(circle at 88% 72%,rgba(255,55,0,.12),transparent 24%);
  filter:blur(32px);
}
.grid{
  position:fixed;inset:0;z-index:-1;opacity:.10;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:44px 44px;
  transform:perspective(520px) rotateX(55deg) scale(1.7) translateY(18%);
}
.card{
  width:min(455px,100%);padding:30px 22px 24px;text-align:center;
  background:rgba(10,10,10,.82);border:1px solid rgba(255,255,255,.13);
  border-radius:28px;box-shadow:0 25px 90px rgba(0,0,0,.65),0 0 55px rgba(255,80,0,.13);
  backdrop-filter:blur(18px);
}
.avatar{
  width:122px;height:122px;margin:0 auto 15px;border-radius:50%;
  object-fit:cover;border:4px solid #fff;
  box-shadow:0 0 0 4px #ff5a00,0 0 38px rgba(255,85,0,.5);
  display:block;
}
h1{font-size:31px;letter-spacing:.8px;margin-bottom:6px}
.bio{color:#bdbdbd;font-size:14px;margin-bottom:24px}
.links{display:grid;gap:12px}
a{
  position:relative;text-decoration:none;color:#fff;padding:16px 18px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-weight:800;font-size:16px;letter-spacing:.2px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
  transition:.2s transform,.2s box-shadow,.2s background;
}
a:hover{transform:translateY(-3px);background:rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.icon{width:23px;height:23px;display:grid;place-items:center;flex:0 0 23px}
.icon svg{width:23px;height:23px;fill:currentColor}
.livepix .icon{font-size:20px}
.note{margin-top:22px;color:#666;font-size:11px}
</style>
